{% extends "course_allocation/base.html" %}
{% load static %}

{% block page_title %}Course Allocation Template{% endblock %}

{% block allocation_content %}
<style>
    .cat-container { padding: 1rem; width: 100%; max-width: 700px; margin: 0 auto; }
    .cat-error-card { background: #fbe6e5; border: 1px solid #f0b8b4; color: #7a1f1a; padding: 1.25rem 1.5rem; border-radius: 0.75rem; font-size: 0.9rem; }
    .cat-btn-back { display: inline-block; margin-top: 1rem; padding: 0.55rem 1.1rem; border-radius: 0.5rem; background: #5b6e53; color: white; text-decoration: none; font-size: 0.88rem; font-weight: 600; }
</style>
<div class="cat-container">
  <div class="cat-error-card">{{ error }}</div>
  <a href="{% url 'course_allocation_template_page' %}" class="cat-btn-back">Back</a>
</div>
{% endblock %}
