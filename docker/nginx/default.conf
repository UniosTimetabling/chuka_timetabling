# ──────────────────────────────────────────────────────────────
# docker/nginx/default.conf
# Nginx reverse-proxy for Chuka University Timetabling System
# ──────────────────────────────────────────────────────────────

# Resolve 'web' at runtime via Docker's embedded DNS instead of once at
# nginx startup. A static "upstream { server web:8000; }" block makes nginx
# refuse to start at all if the web container isn't DNS-registered yet
# (e.g. a race right after a host reboot when everything cold-starts
# together) — nginx would crash-loop instead of just waiting and retrying.
resolver 127.0.0.11 valid=10s;

# ── HTTP → HTTPS redirect (comment out if no SSL cert yet) ───
server {
    listen 80;
    server_name _;

    # Let's Encrypt / ACME challenge passthrough
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (main server block) ─────────────────────────────────
# Comment this whole block and use the plain HTTP block below
# if you don't have SSL certificates yet.
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64M;

    # ── Maintenance mode ───────────────────────────────────────
    # deploy_production_webserver.sh drops a file at
    # docker/nginx/maintenance/maintenance.flag (bind-mounted below)
    # before it touches anything disruptive, and removes it once the
    # new stack passes its smoke tests. While it's present, every
    # request gets the branded "be right back" page instead of
    # whatever the half-deployed backend would otherwise show.
    # `proxy_intercept_errors` + `error_page 502 503 504` also route
    # any *unplanned* backend outage (crash, still-starting container)
    # through the same page, so visitors never see a raw nginx error.
    set $maintenance_on 0;
    if (-f /etc/nginx/maintenance/maintenance.flag) {
        set $maintenance_on 1;
    }
    if ($maintenance_on = 1) {
        return 503;
    }
    error_page 502 503 504 =503 @maintenance;
    location @maintenance {
        root /etc/nginx/maintenance;
        rewrite ^ /index.html break;
        add_header Retry-After 180 always;
        add_header Cache-Control "no-store" always;
    }

    # ── Security headers ──────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: 'self' + inline (Django templates/admin use inline styles/scripts
    # in places) + the specific external CDNs the templates actually load
    # (Font Awesome, Bootstrap/Bootstrap Icons, Google Fonts, html2canvas).
    # Audited against the codebase on 2026-08-05 — if a template adds a new
    # CDN later, that domain needs to be added here too or it'll be silently
    # blocked (check the browser console for "Refused to load" CSP errors).
    # code.jquery.com added: many autoscheduler/panel templates load jQuery
    # directly from it rather than jsdelivr. connect-src added so Chrome
    # DevTools can fetch jsdelivr's .map files for the bootstrap bundle
    # without a CSP violation (falls back to default-src otherwise).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.jquery.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://cdn.jsdelivr.net;" always;

    # Static files (Django collectstatic output)
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files (user uploads)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy everything else to Gunicorn
    location / {
        set                $django_upstream http://web:8000;
        proxy_pass         $django_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Program Course CSV imports no longer run inline (see
        # program_management/tasks.py — they're handed to a Celery worker
        # and the admin request returns immediately), so this is not what
        # bounds import duration any more. It's kept generous (900s) as
        # headroom for the other slow synchronous endpoints in this project
        # (PDF generation, xlsx export, auto-allocation) that still do run
        # inline within a single request.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 30s;
        # Catch a still-starting/crashed backend even when the maintenance
        # flag isn't set (e.g. someone ran `docker compose up` by hand
        # instead of through the deploy script) — same fallback page
        # instead of a raw 502/504.
        proxy_intercept_errors on;
    }
}

