# ── Tailscale Funnel target ─────────────────────────────────────
# Plain HTTP, deliberately separate from the port-80 block above
# (which unconditionally 301s to https:// and would otherwise send
# Tailscale into a redirect loop against itself). Only reachable at
# 127.0.0.1:8088 on the HOST — docker-compose.yml binds it to
# loopback only, and scripts/z_omega_deployment_script/11_tailscale_setup.sh
# points `tailscale serve` at exactly that address. It is never
# reachable from the LAN or the public internet directly; Tailscale's
# own edge is what terminates real TLS for *.ts.net and is the only
# thing allowed to reach this port, over the host loopback interface.
server {
    listen 8088;
    server_name _;

    client_max_body_size 64M;

    set $maintenance_on 0;
    if (-f /etc/nginx/maintenance/maintenance.flag) {
        set $maintenance_on 1;
    }
    if ($maintenance_on = 1) {
        return 503;
    }
    error_page 502 503 504 =503 @maintenance;
    location @maintenance {
        root /etc/nginx/maintenance;
        rewrite ^ /index.html break;
        add_header Retry-After 180 always;
        add_header Cache-Control "no-store" always;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        set                $django_upstream http://web:8000;
        proxy_pass         $django_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Hard-coded "https", not $scheme: Tailscale Funnel terminates
        # real TLS at its own edge and forwards plain HTTP to this port,
        # so $scheme here would wrongly say "http" and trip Django's
        # SECURE_SSL_REDIRECT (see SECURE_PROXY_SSL_HEADER in settings.py)
        # into 301-redirecting every request right back to itself.
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 30s;
        proxy_intercept_errors on;
    }
}
