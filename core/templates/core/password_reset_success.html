{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Updated · Chuka University</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#0b1f4a;--orange:#f47c20;--white:#ffffff;--text-mid:#4a5778;--success:#1b7e3a}
    html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:linear-gradient(155deg,#071435 0%,#1a3260 55%,#1e4080 100%);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
    .card{background:var(--white);border-radius:16px;box-shadow:0 24px 64px rgba(7,20,53,.35);padding:3rem 2.4rem;width:100%;max-width:400px;text-align:center;position:relative;overflow:hidden;animation:up .4s cubic-bezier(.4,0,.2,1)}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--orange),#ffa048)}
    @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .success-icon{width:80px;height:80px;background:rgba(27,126,58,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;border:3px solid rgba(27,126,58,.2)}
    .success-icon i{font-size:2.2rem;color:var(--success)}
    h2{font-size:1.7rem;font-weight:800;color:var(--navy);margin-bottom:.6rem;letter-spacing:-.02em}
    p{font-size:.9rem;color:var(--text-mid);line-height:1.6;margin-bottom:1.5rem}
    .login-btn{display:inline-flex;align-items:center;gap:8px;padding:.8rem 2rem;background:linear-gradient(135deg,var(--orange),#e06a10);color:#fff;text-decoration:none;border-radius:9px;font-weight:700;font-size:.95rem;box-shadow:0 4px 14px rgba(244,124,32,.38);transition:transform .15s,box-shadow .15s}
    .login-btn:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(244,124,32,.48)}
    .countdown{font-size:.78rem;color:#9aa3b8;margin-top:1rem}
  </style>
</head>
<body>
<div class="card">
  <div class="success-icon"><i class="fas fa-shield-alt"></i></div>
  <h2>Password updated!</h2>
  <p>Your password has been successfully changed. You can now sign in with your new credentials.</p>
  <a href="{% url 'login' %}" class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In Now</a>
  <p class="countdown">Redirecting in <span id="sec">5</span>s…</p>
</div>
<script>
let t=5;
const s=document.getElementById('sec');
const timer=setInterval(()=>{t--;s.textContent=t;if(t<=0){clearInterval(timer);window.location='{% url "login" %}'}},1000);
</script>
</body>
</html>
